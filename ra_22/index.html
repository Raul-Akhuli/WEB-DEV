<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid blue;

            /*only inline can not give spaces form up only in side so we have to use inline-block*/
            display: inline-block;
            /*help to convert block elements to inline */
            padding: 45px;
            margin: 10px;
            /* display: none;                help to hide the element from the page but it will be present in the code and also it will not take any space on the page */
        }

        .box1 {
            /* display:none; */
            /* visibility: hidden;              help to hide the element from the page but it will be present in the code and also it will take space on the page; */
            border: 2px solid red;
        }
    </style>
</head>

<body>

    <!-- https://developer.mozilla.org/en-US/docs/Web/CSS/display -->
    <div class="box box1">
        This is a box.
    </div>

    <div class="box">
        Also a nice box.
    </div>

    <span>I am a good</span>
    <span>Boy</span>
</body>

</html>
